<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fridge magnet photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7; --card: #FFFFFF; --ink: #15171A; --muted: #5C636E; --line: #E3E6EA;
    --accent: #2457C5; --good: #2F8A4E; --warn: #B3261E;
    --shadow: 0 1px 2px rgba(21,23,26,.10), 0 6px 14px rgba(21,23,26,.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 Inter, system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }

  /* Login */
  .login { max-width: 340px; margin: 18vh auto 0; display: flex; flex-direction: column; gap: 12px; }
  .login h1 { margin: 0 0 4px; font-size: 24px; }
  .login input { font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); min-height: 48px; }
  .primary { border: none; border-radius: 10px; background: var(--ink); color: #FFF; font-weight: 600; min-height: 48px; }

  /* Header and status */
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .icon-btn { border: none; background: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
  .icon-btn:hover { background: rgba(21,23,26,.06); }
  .status { margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .status div { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .status div + div { border-left: 1px solid var(--line); }
  .status span:first-child { font-size: 11px; color: var(--muted); }
  .status strong { font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; overflow-wrap: anywhere; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* Upload */
  .drop { margin-top: 12px; width: 100%; border: 1.5px dashed #B9C0CA; border-radius: 12px; background: var(--card); min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; text-align: left; }
  .drop.over, body.dragging .drop { border-color: var(--accent); background: #EEF3FC; }
  .drop b { display: block; font-size: 14px; }
  .drop small { font-size: 12px; color: var(--muted); }
  .msg { margin: 8px 0 0; font-size: 13px; color: var(--warn); white-space: pre-line; }
  .hint { margin: 14px 0 0; font-size: 12px; color: var(--muted); }

  /* Photo cards */
  .grid { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
  .card { margin: 0; background: var(--card); padding: 8px 8px 0; box-shadow: var(--shadow); position: relative; }
  .card.is-next { outline: 2px solid var(--accent); outline-offset: 2px; }
  .photo { display: block; width: 100%; padding: 0; border: none; background: #DDE1E6; aspect-ratio: 3 / 4; position: relative; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: auto; }
  .photo.panel img { image-rendering: pixelated; }
  .pill { position: absolute; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; color: #FFF; pointer-events: none; }
  .pill.view { left: 8px; bottom: 8px; background: rgba(21,23,26,.85); }
  .pill.tag { left: 8px; top: 8px; }
  .pill.now { background: var(--ink); }
  .pill.next { background: var(--accent); }
  .del { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border: none; background: none; display: grid; place-items: center; }
  .del span { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; }
  .del.armed { width: auto; right: 8px; }
  .card:has(.del.armed) .pill.tag { visibility: hidden; }
  .del.armed span { width: auto; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--warn); color: #FFF; font-size: 13px; font-weight: 700; }
  .chin { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .chin .date { font-weight: 600; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chin button { border: none; background: none; font-size: 13px; font-weight: 600; min-height: 44px; padding: 0 2px; }
  .chin button.on { color: var(--accent); cursor: default; }
  .empty { margin-top: 28px; text-align: center; color: var(--muted); }
  .chin { flex-wrap: wrap; column-gap: 8px; }
  .chin .date, .chin button { white-space: nowrap; }
  .chin .acts { display: flex; gap: 12px; margin-left: auto; }

  /* Magnets: Library plus one tab per magnet */
  .tabs { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .tab { flex: none; display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .tab.on { background: var(--ink); border-color: var(--ink); color: #FFF; }
  .tab.add { border-style: dashed; color: var(--muted); }
  .tab .mini { font-size: 11px; font-weight: 600; color: var(--muted); }
  .tab.on .mini { color: #C9CDD3; }
  .magnet-tools { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .magnet-tools button { border: none; background: none; padding: 0; min-height: 36px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .magnet-tools button.armed { color: var(--warn); }
  .pairing { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px dashed #B9C0CA; background: var(--card); font-size: 13px; color: var(--muted); }
  .pairing b { color: var(--ink); }
  .card.off .photo { opacity: .45; }
  .on-list { width: 100%; font-size: 11px; color: var(--muted); padding-bottom: 6px; margin-top: -8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chin button.toggle { color: var(--accent); }
  .chin button.toggle.added { color: var(--good); }

  /* Magnet dialog: add, rename, pairing code */
  dialog#magnet-dlg { border: none; border-radius: 14px; padding: 18px; max-width: min(420px, calc(100vw - 24px)); width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog#magnet-dlg::backdrop { background: rgba(21,23,26,.55); }
  #magnet-dlg h2 { margin: 0 0 6px; font-size: 17px; }
  #magnet-dlg p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  #magnet-dlg input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; min-height: 48px; }
  .code { margin: 6px 0 12px; font: 700 30px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; text-align: center; padding: 14px; border-radius: 12px; background: var(--bg); user-select: all; }

  /* Crop editor */
  dialog#cropper { border: none; border-radius: 14px; padding: 16px; max-width: min(560px, calc(100vw - 24px)); width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog#cropper::backdrop { background: rgba(21,23,26,.55); }
  #crop-title { margin: 0 0 2px; font-size: 17px; }
  #crop-sub { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .stage-wrap { display: flex; justify-content: center; background: #F4F5F7; border-radius: 10px; padding: 8px; }
  .stage { position: relative; display: inline-block; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; line-height: 0; }
  .stage img { display: block; max-width: 100%; max-height: 58vh; }
  .crop-box { position: absolute; box-shadow: 0 0 0 9999px rgba(21,23,26,.55); outline: 2px solid #FFF; cursor: grab; touch-action: none; }
  .crop-box:active { cursor: grabbing; }
  .crop-box::after { content: ""; position: absolute; inset: 0; background:
      linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.5) 33.3%, transparent 33.4%, transparent 66.5%, rgba(255,255,255,.5) 66.6%, transparent 66.7%),
      linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.5) 33.3%, transparent 33.4%, transparent 66.5%, rgba(255,255,255,.5) 66.6%, transparent 66.7%); pointer-events: none; }
  .zoom { display: flex; align-items: center; gap: 10px; margin: 12px 2px 4px; font-size: 13px; color: var(--muted); }
  .zoom input { flex: 1; min-height: 44px; }
  .crop-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .crop-actions button { min-height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line); background: var(--card); }
  .crop-actions .primary { border: none; background: var(--ink); color: #FFF; }
</style>
</head>
<body>

<form class="login" id="login" hidden>
  <h1>Fridge magnet</h1>
  <label for="password" class="sub">Password</label>
  <input id="password" type="password" name="password" autocomplete="current-password" required>
  <button class="primary">Log in</button>
  <p class="msg" id="login-msg" role="alert"></p>
</form>

<main class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>Photos</h1>
      <p class="sub" id="count"></p>
    </div>
    <button type="button" class="icon-btn" id="logout" aria-label="Log out" title="Log out">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Library and magnets"></nav>

  <div id="magnet-panel" hidden>
    <section class="status" aria-label="Magnet status">
      <div><span>Checked in</span><strong id="seen">–</strong></div>
      <div><span>Battery</span><strong id="battery">–</strong></div>
      <div><span>Showing</span><strong id="showing">–</strong></div>
    </section>
    <p class="pairing" id="pairing" hidden></p>
    <div class="magnet-tools">
      <button type="button" id="m-rename">Rename</button>
      <button type="button" id="m-code">New pairing code</button>
      <button type="button" id="m-remove">Remove magnet</button>
    </div>
  </div>

  <button type="button" class="drop" id="drop">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
    <span><b id="drop-title">Add photos</b><small id="drop-sub">Choose several, or drop them here</small></span>
  </button>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <p class="msg" id="msg" role="alert"></p>

  <p class="hint" id="hint">Tap a photo to see it in the magnet's colors.</p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No photos yet. Add some, then choose which magnets show them.</p>
</main>

<dialog id="magnet-dlg" aria-labelledby="m-title">
  <form method="dialog" id="m-form">
    <h2 id="m-title"></h2>
    <p id="m-text"></p>
    <div class="code" id="m-code-box" hidden></div>
    <input id="m-name" name="name" maxlength="60" autocomplete="off" aria-label="Magnet name" placeholder="e.g. Grandma &amp; Grandpa">
    <div class="crop-actions">
      <button type="button" id="m-cancel">Cancel</button>
      <button type="submit" id="m-ok" class="primary">Add</button>
    </div>
  </form>
</dialog>

<dialog id="cropper" aria-labelledby="crop-title">
  <h2 id="crop-title">Frame the photo</h2>
  <p id="crop-sub">Drag the box to choose what shows on the magnet.</p>
  <div class="stage-wrap"><div class="stage" id="stage"><img id="crop-img" alt="Photo being cropped"><div class="crop-box" id="crop-box"></div></div></div>
  <label class="zoom" for="zoom">Zoom <input id="zoom" type="range" min="35" max="100" value="100"></label>
  <div class="crop-actions">
    <button type="button" id="crop-rest" hidden>Upload the rest centred</button>
    <button type="button" id="crop-skip">Skip</button>
    <button type="button" id="crop-ok" class="primary">Upload</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
const LOW_MV = 3500;
let photos = [];
let magnets = [];
let view = "library";   // "library", or the id of the magnet being looked at
try { const v = localStorage.getItem("view"); if (v) view = v === "library" ? v : Number(v); } catch (e) { /* storage blocked */ }
const panelView = new Set();  // photo ids currently showing the magnet preview

const shortDate = (t) => new Date(t * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
function seenText(t) {
  if (!t) return "Not yet";
  const d = new Date(t * 1000), now = new Date();
  const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  const days = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (days === 0) return "Today " + time;
  if (days === 1) return "Yesterday " + time;
  return shortDate(t);
}

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids.filter((k) => k != null));
  return e;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { show(false); throw new Error("login required"); }
  return r;
}
const sendJSON = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

function show(loggedIn) {
  $("login").hidden = loggedIn;
  $("app").hidden = !loggedIn;
  if (!loggedIn) $("password").focus();
}

const magnet = () => magnets.find((m) => m.id === view);
function setView(v) {
  view = v;
  try { localStorage.setItem("view", String(v)); } catch (e) { /* storage blocked */ }
  renderAll();
}

// Press twice: the first tap arms the button for 4 seconds (tapping elsewhere cancels); the second acts.
function pressTwice(btn, armedHTML, action) {
  const restHTML = btn.innerHTML, restLabel = btn.ariaLabel, restTitle = btn.title;
  let timer = null;
  const disarm = () => {
    clearTimeout(timer); timer = null;
    btn.classList.remove("armed"); btn.innerHTML = restHTML; btn.ariaLabel = restLabel; btn.title = restTitle;
    removeEventListener("pointerdown", outside, true);
  };
  const outside = (e) => { if (!btn.contains(e.target)) disarm(); };
  btn.onclick = async () => {
    if (!timer) {
      btn.classList.add("armed"); btn.innerHTML = armedHTML;
      btn.ariaLabel = "Tap again to confirm"; btn.title = "Tap again to confirm";
      timer = setTimeout(disarm, 4000);
      addEventListener("pointerdown", outside, true);
      return;
    }
    disarm();
    await action();
  };
}

function renderTabs() {
  const tab = (label, v, extra) => el("button", {
    type: "button", className: "tab" + (view === v ? " on" : ""), ariaPressed: String(view === v), onclick: () => setView(v),
  }, label, extra);
  const tabs = [tab("Library", "library")];
  for (const m of magnets) {
    const extra = m.battery_low ? el("span", { className: "dot", style: "background: var(--warn)", title: "Battery low" })
      : !m.paired ? el("span", { className: "mini", textContent: "not paired" }) : null;
    tabs.push(tab(m.name, m.id, extra));
  }
  tabs.push(el("button", { type: "button", className: "tab add", textContent: "+ Add magnet", onclick: addMagnet }));
  $("tabs").replaceChildren(...tabs);
}

function renderMagnetPanel() {
  const m = magnet();
  $("magnet-panel").hidden = !m;
  if (!m) return;
  $("seen").textContent = seenText(m.last_seen);
  const bat = $("battery");
  bat.replaceChildren();
  bat.style.color = "";
  if (m.battery_mv == null) bat.textContent = "–";
  else {
    bat.append(el("span", { className: "dot", style: `background: var(${m.battery_low ? "--warn" : "--good"})` }),
               (m.battery_mv / 1000).toFixed(2) + " V" + (m.battery_low ? " · low" : ""));
    if (m.battery_low) bat.style.color = "var(--warn)";
  }
  const cur = photos.find((p) => p.id === m.current_id);
  $("showing").textContent = cur ? shortDate(cur.created_at) : "–";
  const pairing = $("pairing");
  pairing.hidden = m.paired && !m.pairing_expires;
  if (!pairing.hidden) {
    const hours = m.pairing_expires ? Math.max(1, Math.round((m.pairing_expires * 1000 - Date.now()) / 36e5)) : 0;
    pairing.replaceChildren(
      el("b", { textContent: m.paired ? "A new pairing code is waiting. " : "Not paired yet. " }),
      m.pairing_expires
        ? `On the magnet's Wi-Fi setup page, type the pairing code you were shown. It works for about ${hours} more hour${hours === 1 ? "" : "s"}.`
        : "The pairing code has expired. Tap \u201cNew pairing code\u201d for another.");
  }
  $("m-rename").onclick = async () => {
    const name = await magnetDialog({ title: "Rename the magnet", text: "", name: m.name, ok: "Save" });
    if (name == null) return;
    const r = await api(`/api/devices/${m.id}`, sendJSON("PATCH", { name }));
    $("msg").textContent = r.ok ? "" : (await r.json()).detail;
    refresh();
  };
  $("m-code").onclick = async () => {
    const r = await api(`/api/devices/${m.id}/pair-code`, { method: "POST" });
    await showCode(m.name, (await r.json()).pair_code, m.paired);
    refresh();
  };
  const remove = $("m-remove");
  remove.innerHTML = "Remove magnet";
  pressTwice(remove, "Tap again to remove", async () => {
    await api(`/api/devices/${m.id}`, { method: "DELETE" });
    setView("library");
    refresh();
  });
}

// One dialog for adding and renaming a magnet, and for showing a pairing code.
function magnetDialog({ title, text, name, ok, code }) {
  const dlg = $("magnet-dlg");
  $("m-title").textContent = title;
  $("m-text").textContent = text;
  $("m-code-box").hidden = !code;
  $("m-code-box").textContent = code || "";
  $("m-name").hidden = !!code;
  $("m-name").value = name || "";
  $("m-ok").textContent = ok;
  $("m-cancel").hidden = !!code;
  return new Promise((resolve) => {
    const done = (value) => { dlg.close(); resolve(value); };
    $("m-form").onsubmit = (e) => { e.preventDefault(); done(code ? true : $("m-name").value.trim() || null); };
    $("m-cancel").onclick = () => done(null);
    dlg.oncancel = (e) => { e.preventDefault(); done(null); };
    dlg.showModal();
    if (!code) $("m-name").focus();
  });
}

const showCode = (name, code, replacing) => magnetDialog({
  title: `Pairing code for ${name}`,
  text: "On the magnet's Wi-Fi setup page, type this code. It works once, for 24 hours." +
        (replacing ? " The magnet keeps working with its old key until the new code is used." : ""),
  code, ok: "Done",
});

async function addMagnet() {
  const name = await magnetDialog({ title: "Add a magnet", text: "Give it a name you'll recognise.", name: "", ok: "Add" });
  if (name == null) return;
  const r = await api("/api/devices", sendJSON("POST", { name }));
  if (!r.ok) { $("msg").textContent = (await r.json()).detail; return; }
  const m = await r.json();
  view = m.id;
  try { localStorage.setItem("view", String(m.id)); } catch (e) { /* storage blocked */ }
  await refresh();
  await showCode(m.name, m.pair_code, false);
}

function card(p) {
  const m = magnet();
  const onIt = m ? m.photo_ids.includes(p.id) : false;
  const many = m && m.photo_ids.length > 1;
  const isNow = m && onIt && p.id === m.current_id, isNext = m && onIt && many && p.id === m.next_id;
  const panel = panelView.has(p.id);
  const v = p.crop ? [p.crop.x, p.crop.y, p.crop.w].map((n) => n.toFixed(4)).join("") : "0";   // new crop, new image
  const img = el("img", { alt: "", loading: "lazy", src: `/api/photos/${p.id}/image?view=${panel ? "panel" : "photo"}&v=${v}` });
  const photo = el("button", {
    type: "button", className: "photo" + (panel ? " panel" : ""),
    ariaLabel: panel ? "Show the original photo" : "Show how the magnet will draw it",
    onclick: () => { panel ? panelView.delete(p.id) : panelView.add(p.id); renderGrid(); },
  }, img);
  if (panel) photo.append(el("span", { className: "pill view", textContent: "Magnet preview" }));
  const fig = el("figure", { className: "card" + (isNext ? " is-next" : "") + (m && !onIt ? " off" : "") }, photo);
  const date = el("span", { className: "date", textContent: shortDate(p.created_at) });
  const acts = el("span", { className: "acts" });
  const chin = el("figcaption", { className: "chin" }, date, acts);
  fig.append(chin);

  if (!m) {
    // Library: manage the photo itself.
    const del = el("button", { type: "button", className: "del", ariaLabel: "Delete photo", title: "Delete" });
    del.innerHTML = "<span>" + TRASH + "</span>";
    pressTwice(del, "<span>Delete?</span>", async () => {
      await api(`/api/photos/${p.id}`, { method: "DELETE" });
      panelView.delete(p.id);
      refresh();
    });
    const cropBtn = el("button", { type: "button", textContent: "Crop", title: "Move what shows on the magnet" });
    cropBtn.onclick = async () => {
      const res = await editCrop(`/api/photos/${p.id}/image?view=original`, p.crop, { title: "Move the crop", ok: "Save", skip: "Cancel" });
      if (res.action !== "ok" || !res.crop) return;
      const r = await api(`/api/photos/${p.id}/crop`, sendJSON("PUT", res.crop));
      $("msg").textContent = r.ok ? "" : (await r.json()).detail;
      refresh();
    };
    acts.append(cropBtn);
    const on = magnets.filter((x) => x.photo_ids.includes(p.id)).map((x) => x.name);
    chin.append(el("span", { className: "on-list", textContent: on.length ? "On " + on.join(", ") : "Not on a magnet yet" }));
    fig.append(del);
    return fig;
  }

  // A magnet: choose which photos it shows, and what comes next.
  if (isNext) fig.append(el("span", { className: "pill tag next", textContent: "Next up" }));
  else if (isNow) fig.append(el("span", { className: "pill tag now", textContent: "Showing now" }));
  const toggle = el("button", { type: "button", className: "toggle" + (onIt ? " added" : ""), ariaPressed: String(onIt),
                                textContent: onIt ? "\u2713 On magnet" : "+ Add", title: onIt ? "Take it off this magnet" : "Put it on this magnet" });
  toggle.onclick = async () => {
    await api(`/api/devices/${m.id}/photos/${p.id}`, { method: onIt ? "DELETE" : "PUT" });
    refresh();
  };
  acts.append(toggle);
  if (onIt && many) {
    const nextBtn = el("button", { type: "button", textContent: isNext ? "Next up" : "Show next", className: isNext ? "on" : "" });
    if (isNext) nextBtn.disabled = true;
    else nextBtn.onclick = async () => { await api(`/api/devices/${m.id}/photos/${p.id}/next`, { method: "POST" }); refresh(); };
    acts.append(nextBtn);
  }
  return fig;
}

function renderGrid() {
  const m = magnet(), n = photos.length;
  $("count").textContent = m
    ? `${m.photo_ids.length} of ${n} photo${n === 1 ? "" : "s"} on ${m.name} · shuffled, a new one each morning`
    : `${n} photo${n === 1 ? "" : "s"} in the library`;
  $("empty").hidden = n > 0;
  $("hint").hidden = n === 0;
  $("hint").textContent = m
    ? "Tap \u201c+ Add\u201d to put a photo on this magnet. New uploads go to the library."
    : magnets.length ? "Tap a photo to see it in the magnet's colors. Choose a magnet above to pick its photos."
                     : "Tap a photo to see it in the magnet's colors. Add a magnet above to start showing photos.";
  $("grid").replaceChildren(...[...photos].reverse().map(card));  // newest first
}

function renderAll() {
  if (view !== "library" && !magnet()) view = "library";
  renderTabs();
  renderMagnetPanel();
  renderGrid();
}

async function refresh() {
  try {
    const [p, d] = await Promise.all([api("/api/photos"), api("/api/devices")]);
    photos = await p.json();
    magnets = await d.json();
    show(true);
    renderAll();
  } catch (e) { /* the login form is showing */ }
}

// --- Crop editor: a 3:4 box over the photo, dragged to place it, zoomed with the slider.
// Crops are fractions of the upright photo, which is what the server expects.
const RATIO = 3 / 4;   // picture width / height
function maxCrop(W, H) {
  if (W / H > RATIO) { const w = RATIO * H / W; return { x: (1 - w) / 2, y: 0, w, h: 1 }; }
  const h = W / (RATIO * H); return { x: 0, y: (1 - h) / 2, w: 1, h };
}

function editCrop(src, initial, opts) {
  const dlg = $("cropper"), img = $("crop-img"), box = $("crop-box"), zoom = $("zoom");
  $("crop-title").textContent = opts.title;
  $("crop-ok").textContent = opts.ok || "Upload";
  $("crop-skip").textContent = opts.skip || "Skip";
  $("crop-rest").hidden = !opts.rest;
  return new Promise((resolve) => {
    let mx, s = 1, cx = 0.5, cy = 0.5;
    const crop = () => {
      const w = mx.w * s, h = mx.h * s;
      cx = Math.min(Math.max(cx, w / 2), 1 - w / 2);
      cy = Math.min(Math.max(cy, h / 2), 1 - h / 2);
      return { x: cx - w / 2, y: cy - h / 2, w, h };
    };
    const draw = () => {
      const c = crop();
      Object.assign(box.style, { left: `${c.x * 100}%`, top: `${c.y * 100}%`, width: `${c.w * 100}%`, height: `${c.h * 100}%` });
    };
    const done = (action) => {
      dlg.close();
      img.onload = img.onerror = box.onpointerdown = box.onpointermove = zoom.oninput = null;
      resolve({ action, crop: mx ? crop() : null });
    };
    img.onload = () => {
      mx = maxCrop(img.naturalWidth, img.naturalHeight);
      if (initial) { s = Math.min(1, initial.w / mx.w); cx = initial.x + initial.w / 2; cy = initial.y + initial.h / 2; }
      else { s = 1; cx = cy = 0.5; }
      zoom.value = Math.round(s * 100);
      draw();
    };
    img.onerror = () => done("ok");   // a photo the browser can't show (e.g. HEIC): the server crops it centred
    let last = null;
    box.onpointerdown = (e) => { last = [e.clientX, e.clientY]; box.setPointerCapture(e.pointerId); e.preventDefault(); };
    box.onpointermove = (e) => {
      if (!last || !mx) return;
      cx += (e.clientX - last[0]) / img.clientWidth;
      cy += (e.clientY - last[1]) / img.clientHeight;
      last = [e.clientX, e.clientY];
      draw();
    };
    box.onpointerup = box.onpointercancel = () => { last = null; };
    zoom.oninput = () => { s = zoom.value / 100; if (mx) draw(); };
    $("crop-ok").onclick = () => done("ok");
    $("crop-skip").onclick = () => done("skip");
    $("crop-rest").onclick = () => done("rest");
    dlg.oncancel = (e) => { e.preventDefault(); done("skip"); };
    img.src = src;
    dlg.showModal();
  });
}

async function upload(files) {
  files = [...files];
  if (!files.length) return;
  const errors = [];
  $("msg").textContent = "";
  let centreRest = false;
  for (const [i, f] of files.entries()) {
    let crop = null;
    if (!centreRest) {
      const url = URL.createObjectURL(f);
      const res = await editCrop(url, null, { title: files.length > 1 ? `Photo ${i + 1} of ${files.length}` : "Frame the photo",
                                              rest: files.length - i > 1 });
      URL.revokeObjectURL(url);
      if (res.action === "skip") continue;
      if (res.action === "rest") centreRest = true;
      crop = res.crop;
    }
    $("drop-title").textContent = `Uploading ${i + 1} of ${files.length}…`;
    $("drop-sub").textContent = f.name;
    const body = new FormData();
    body.append("file", f);
    if (crop) body.append("crop", JSON.stringify(crop));
    try {
      const r = await api("/api/photos", { method: "POST", body });
      if (!r.ok) errors.push(`${f.name}: ${(await r.json()).detail}`);
    } catch (e) { errors.push(`${f.name}: ${e.message}`); }
  }
  $("drop-title").textContent = "Add photos";
  $("drop-sub").textContent = "Choose several, or drop them here";
  $("msg").textContent = errors.join("\n");
  refresh();
}

$("login").onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch("/login", { method: "POST", body: new FormData(e.target) });
  $("login-msg").textContent = r.ok ? "" : "Wrong password";
  if (r.ok) { e.target.reset(); refresh(); }
};
$("logout").onclick = async () => { await fetch("/logout", { method: "POST" }); show(false); };
$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => { upload(e.target.files); e.target.value = ""; };

// Drag and drop anywhere on the page.
let dragDepth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  if (!$("app").hidden) upload(e.dataTransfer.files);
});

refresh();
</script>
</body>
