# The magnet server behind a Cloudflare Tunnel. Secrets come from .env
# (git-ignored; copy .env.example). Setup steps: server/README.md.
services:
  magnet:
    build: ./server
    restart: unless-stopped
    env_file: .env
    volumes:
      - magnet-data:/data      # photos, frames and the database; see server/README.md for backups
    ports:
      - "127.0.0.1:8000:8000"   # local checks only; the internet reaches it through the tunnel

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - magnet

volumes:
  magnet-data:
